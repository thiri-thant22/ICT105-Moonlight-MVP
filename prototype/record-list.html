<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Records | Budget Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}


body{

background:#eef4ff;
color:#1f2937;
overflow-x:hidden;

}


body::before{

content:"";
position:fixed;
width:450px;
height:450px;
background:#3b82f622;
border-radius:50%;
top:-180px;
right:-120px;
filter:blur(60px);
z-index:-2;

}


body::after{

content:"";
position:fixed;
width:380px;
height:380px;
background:#06b6d422;
border-radius:50%;
bottom:-160px;
left:-120px;
filter:blur(70px);
z-index:-2;

}



/* HEADER */


header{

position:sticky;
top:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 7%;

background:rgba(255,255,255,.82);
backdrop-filter:blur(18px);

box-shadow:0 6px 18px rgba(0,0,0,.06);

z-index:999;

}



.logo{

font-size:30px;
font-weight:800;
color:#2563eb;

}


.logo span{

color:#111827;

}



nav{

display:flex;
align-items:center;
gap:25px;

}



nav a{

text-decoration:none;
color:#374151;
font-weight:500;

position:relative;
transition:.3s;

}



nav a:hover{

color:#2563eb;

}



nav a::after{

content:"";
position:absolute;
left:0;
bottom:-6px;

width:0;
height:3px;

background:#2563eb;
border-radius:20px;

transition:.3s;

}



nav a:hover::after{

width:100%;

}



.demo-btn{

padding:12px 25px;

border:none;
border-radius:30px;

background:linear-gradient(135deg,#2563eb,#06b6d4);

color:white;

font-weight:600;

cursor:pointer;

transition:.3s;

}


.demo-btn:hover{

transform:translateY(-3px);

box-shadow:0 10px 25px rgba(37,99,235,.35);

}



/* PAGE TITLE */


.container{

width:86%;
margin:60px auto;

}



.page-title{

text-align:center;
font-size:45px;
font-weight:800;

color:#2563eb;

margin-bottom:10px;

}



.subtitle{

text-align:center;
color:#6b7280;

margin-bottom:45px;

}



/* SUMMARY CARDS */


.summary{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:25px;

margin-bottom:40px;

}



.card{

background:white;

padding:28px;

border-radius:25px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

transition:.35s;

}



.card:hover{

transform:translateY(-8px);

}



.card h2{

font-size:38px;

color:#2563eb;

}



.card p{

color:#6b7280;

}



/* SEARCH AREA */


.search-box{

background:white;

padding:25px;

border-radius:25px;

box-shadow:0 15px 35px rgba(0,0,0,.07);

display:flex;

gap:15px;

flex-wrap:wrap;

margin-bottom:35px;

}



input,select{

padding:14px 18px;

border:1px solid #dbeafe;

border-radius:15px;

font-size:15px;

outline:none;

flex:1;

}



input:focus,
select:focus{

border-color:#2563eb;

}



/* TABLE */


.table-box{

background:white;

border-radius:25px;

padding:25px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

overflow-x:auto;

}


table{

width:100%;

border-collapse:collapse;

}



th{

background:linear-gradient(135deg,#2563eb,#06b6d4);

color:white;

padding:16px;

}



td{

padding:15px;

text-align:center;

border-bottom:1px solid #eef2f7;

}



tr:hover{

background:#f8fbff;

}



.status{

background:#dcfce7;

color:#16a34a;

padding:6px 15px;

border-radius:30px;

font-size:13px;

font-weight:600;

}



.action-btn{

border:none;

padding:8px 14px;

border-radius:12px;

color:white;

cursor:pointer;

font-weight:600;

}



.view{

background:#2563eb;

}



.delete{

background:#ef4444;

}



/* FOOTER */


footer{

margin-top:80px;

background:white;

padding:35px;

text-align:center;

color:#6b7280;

box-shadow:0 -5px 20px rgba(0,0,0,.05);

}



/* RESPONSIVE */


@media(max-width:900px){

nav{

display:none;

}


.page-title{

font-size:35px;

}


}

</style>

</head>

<body>


<header>

<div class="logo">
💰 Budget<span>Tracker</span>
</div>


<nav>

<a href="index.html">Home</a>

<a href="input-form.html">Add Expense</a>

<a href="record-list.html">Records</a>

<a href="dashboard.html">Dashboard</a>

<a href="admin-view.html">Admin</a>


<a href="input-form.html">

<button class="demo-btn">
Try Demo
</button>

</a>


</nav>

</header>



<div class="container">


<h1 class="page-title">
Expense Records
</h1>


<p class="subtitle">
View, search and manage your daily expense history
</p>




<div class="summary">


<div class="card">

<h2 id="totalRecords">
0
</h2>

<p>
Total Records
</p>

</div>



<div class="card">

<h2 id="totalAmount">
฿0
</h2>

<p>
Total Expenses
</p>

</div>



<div class="card">

<h2 id="totalCategory">
0
</h2>

<p>
Categories
</p>

</div>


</div>






<div class="search-box">


<input 
type="text"
id="search"
placeholder="Search expense title..."
>



<select id="filter">


<option value="All">
All Categories
</option>

<option>
Food
</option>

<option>
Transport
</option>

<option>
Shopping
</option>

<option>
Education
</option>

<option>
Entertainment
</option>

<option>
Health
</option>

<option>
Others
</option>


</select>


</div>






<div class="table-box">


<table>


<thead>

<tr>

<th>
Title
</th>

<th>
Category
</th>

<th>
Amount
</th>

<th>
Date
</th>

<th>
Payment
</th>

<th>
Status
</th>

<th>
Action
</th>


</tr>


</thead>



<tbody id="expenseTable">


</tbody>


</table>


</div>


</div>





<footer>

© 2026 Budget Tracker | ICT105 Project

</footer>






<script>


let expenses =
JSON.parse(localStorage.getItem("expenses")) || [];



const table =
document.getElementById("expenseTable");


const search =
document.getElementById("search");


const filter =
document.getElementById("filter");



function displayExpenses(list){


table.innerHTML="";



if(list.length===0){


table.innerHTML=`

<tr>

<td colspan="7">

No expense records found.

</td>

</tr>

`;


return;

}




list.forEach((expense,index)=>{


table.innerHTML += `


<tr>


<td>
${expense.title}
</td>


<td>
${expense.category}
</td>


<td>
฿${expense.amount}
</td>


<td>
${expense.date}
</td>


<td>
${expense.payment}
</td>



<td>

<span class="status">

${expense.status || "Completed"}

</span>

</td>




<td>


<button

class="action-btn view"

onclick="viewExpense(${expense.id})">

View

</button>



<button

class="action-btn delete"

onclick="deleteExpense(${index})">

Delete

</button>



</td>


</tr>



`;


});



updateSummary();


}





function updateSummary(){


document.getElementById("totalRecords").innerText =
expenses.length;



let total = expenses.reduce(

(sum,item)=>sum + Number(item.amount),

0

);



document.getElementById("totalAmount").innerText =
"฿" + total.toLocaleString();



let categories = 
[...new Set(expenses.map(e=>e.category))];



document.getElementById("totalCategory").innerText =
categories.length;



}





function deleteExpense(index){


if(confirm("Delete this expense?")){


expenses.splice(index,1);



localStorage.setItem(

"expenses",

JSON.stringify(expenses)

);



displayExpenses(expenses);


}


}




function viewExpense(id){


localStorage.setItem(

"selectedExpense",

id

);



window.location.href="detail-view.html";


}





search.addEventListener(
"keyup",
filterData
);



filter.addEventListener(
"change",
filterData
);




function filterData(){


let keyword =
search.value.toLowerCase();



let category =
filter.value;




let result =
expenses.filter(expense=>{


let matchTitle =
expense.title
.toLowerCase()
.includes(keyword);



let matchCategory =

category==="All" ||

expense.category===category;



return matchTitle && matchCategory;


});



displayExpenses(result);


}





displayExpenses(expenses);



</script>


</body>

</html>
