<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Records | Budget Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}


body{

background:#f4f8ff;
color:#1f2937;

}



/* ===== HEADER ===== */


header{

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 7%;

background:white;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

position:sticky;
top:0;

z-index:100;

}



.logo{

font-size:30px;

font-weight:800;

color:#2563eb;

}



.logo span{

color:#111827;

}



nav{

display:flex;

gap:25px;

align-items:center;

}



nav a{

text-decoration:none;

color:#374151;

font-weight:500;

position:relative;

transition:.3s;

}



nav a:hover{

color:#2563eb;

}



nav a::after{

content:"";

position:absolute;

width:0;

height:3px;

background:#2563eb;

left:0;

bottom:-7px;

border-radius:20px;

transition:.3s;

}



nav a:hover::after{

width:100%;

}




.demo-btn{

padding:12px 25px;

border:none;

border-radius:30px;

background:
linear-gradient(
135deg,
#2563eb,
#06b6d4
);

color:white;

font-weight:600;

cursor:pointer;

transition:.3s;

}



.demo-btn:hover{

transform:translateY(-3px);

box-shadow:
0 10px 25px rgba(37,99,235,.35);

}




/* ===== CONTAINER ===== */


.container{

width:90%;

margin:45px auto;

}




.title{

text-align:center;

margin-bottom:35px;

}



.title h1{

font-size:42px;

color:#2563eb;

font-weight:800;

}



.title p{

color:#64748b;

margin-top:10px;

}

/* ===== FILTER ===== */


.filter-area{

display:flex;

gap:20px;

margin-bottom:30px;

flex-wrap:wrap;

}



.filter-area input,
.filter-area select{

padding:14px 18px;

border:none;

border-radius:15px;

background:white;

box-shadow:
0 8px 20px rgba(0,0,0,.08);

font-size:15px;

outline:none;

}



.filter-area input{

flex:1;

min-width:250px;

}



.filter-area select{

min-width:200px;

}





/* ===== TABLE ===== */


.table-box{

background:white;

padding:25px;

border-radius:22px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

overflow-x:auto;

}



table{

width:100%;

border-collapse:collapse;

min-width:950px;

}



th{

background:

linear-gradient(
135deg,
#2563eb,
#06b6d4
);

color:white;

padding:16px;

}



td{

padding:15px;

text-align:center;

border-bottom:1px solid #eee;

}



tr:hover{

background:#f8fbff;

}





/* STATUS */


.status{

padding:7px 14px;

border-radius:30px;

font-size:13px;

font-weight:600;

color:white;

}



.completed{

background:#22c55e;

}



.pending{

background:#f59e0b;

}



.cancelled{

background:#ef4444;

}





/* BUTTON */


.view-btn{

padding:8px 15px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

cursor:pointer;

margin-right:5px;

}



.delete-btn{

padding:8px 15px;

border:none;

border-radius:10px;

background:#ef4444;

color:white;

cursor:pointer;

}



.view-btn:hover,
.delete-btn:hover{

transform:translateY(-2px);

}




</style>


</head>


<body>


<header>


<div class="logo">

💰 Budget<span>Tracker</span>

</div>



<nav>


<a href="index.html">
Home
</a>


<a href="input-form.html">
Add Expense
</a>


<a href="record-list.html">
Records
</a>


<a href="dashboard.html">
Dashboard
</a>


<a href="admin-view.html">
Admin
</a>



<a href="input-form.html">

<button class="demo-btn">

Try Demo

</button>

</a>


</nav>


</header>

<!-- ===== RECORD CONTENT ===== -->


<div class="container">


<div class="title">

<h1>
Expense Records
</h1>

<p>
View, search and manage all your expense transactions.
</p>

</div>




<!-- SEARCH FILTER -->


<div class="filter-area">


<input 
type="text"
id="search"
placeholder="🔍 Search expense title..."
>



<select id="categoryFilter">


<option value="All">
All Categories
</option>


<option>
Food
</option>


<option>
Transport
</option>


<option>
Shopping
</option>


<option>
Education
</option>


<option>
Entertainment
</option>


<option>
Health
</option>


<option>
Others
</option>


</select>



</div>





<!-- TABLE -->


<div class="table-box">


<table>


<thead>


<tr>


<th>
Title
</th>


<th>
Category
</th>


<th>
Amount
</th>


<th>
Date
</th>


<th>
Payment
</th>


<th>
Status
</th>


<th>
Action
</th>


</tr>


</thead>



<tbody id="expenseTable">


</tbody>



</table>


</div>



</div>

<!-- ===== FOOTER ===== -->


<footer>

© 2026 Budget Tracker | ICT105 Project

</footer>



<style>

footer{

margin-top:60px;

padding:25px;

background:white;

text-align:center;

color:#64748b;

box-shadow:
0 -5px 20px rgba(0,0,0,.05);

}



@media(max-width:900px){

nav{

display:none;

}


.title h1{

font-size:32px;

}

}


</style>





<script>


let expenses =
JSON.parse(localStorage.getItem("expenses")) || [];



const table =
document.getElementById("expenseTable");


const search =
document.getElementById("search");


const categoryFilter =
document.getElementById("categoryFilter");





function displayExpenses(data){


table.innerHTML="";



if(data.length===0){


table.innerHTML=`

<tr>

<td colspan="7">

No Expense Records Found

</td>

</tr>

`;

return;

}



data.forEach((expense)=>{



let statusClass="pending";



if(expense.status==="Completed"){

statusClass="completed";

}

else if(expense.status==="Cancelled"){

statusClass="cancelled";

}



table.innerHTML += `


<tr>


<td>

${expense.title}

</td>



<td>

${expense.category}

</td>



<td>

฿${Number(expense.amount).toLocaleString()}

</td>



<td>

${expense.date}

</td>



<td>

${expense.payment || "Cash"}

</td>




<td>


<span class="status ${statusClass}">

${expense.status}

</span>


</td>




<td>


<button

class="view-btn"

onclick="viewDetail(${expense.id})">

View

</button>




<button

class="delete-btn"

onclick="deleteExpense(${expense.id})">

Delete

</button>


</td>


</tr>


`;



});



}








// VIEW DETAIL


function viewDetail(id){


localStorage.setItem(

"selectedExpense",

id

);



window.location.href="detail-view.html";


}







// DELETE RECORD


function deleteExpense(id){


if(confirm("Delete this expense?")){


expenses =

expenses.filter(
expense=>expense.id!=id
);



localStorage.setItem(

"expenses",

JSON.stringify(expenses)

);



displayExpenses(expenses);



}


}








// SEARCH + FILTER


function filterData(){



let keyword =
search.value.toLowerCase();



let category =
categoryFilter.value;




let result = expenses.filter(expense=>{


let matchTitle =

expense.title
.toLowerCase()
.includes(keyword);



let matchCategory =

category==="All" ||

expense.category===category;



return matchTitle && matchCategory;



});



displayExpenses(result);



}





search.addEventListener(

"keyup",

filterData

);



categoryFilter.addEventListener(

"change",

filterData

);





displayExpenses(expenses);



</script>


</body>

</html>
