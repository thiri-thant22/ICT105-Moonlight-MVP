<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Expense | Budget Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#eef6ff,#ffffff);
min-height:100vh;
color:#1e293b;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 7%;
background:white;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.logo{
font-size:28px;
font-weight:800;
color:#2563eb;
}

.logo span{
color:#111827;
}

nav{
display:flex;
align-items:center;
gap:26px;
}

nav a{
text-decoration:none;
font-weight:500;
color:#334155;
transition:.3s;
position:relative;
}

nav a:hover{
color:#2563eb;
}

nav a::after{
content:"";
position:absolute;
left:0;
bottom:-6px;
width:0;
height:3px;
background:#2563eb;
border-radius:30px;
transition:.3s;
}

nav a:hover::after{
width:100%;
}

.demo-btn{
padding:12px 26px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#2563eb,#06b6d4);
color:white;
font-weight:600;
cursor:pointer;
transition:.35s;
box-shadow:0 10px 25px rgba(37,99,235,.25);
}

.demo-btn:hover{
transform:translateY(-3px);
box-shadow:0 15px 35px rgba(37,99,235,.40);
}

.container{
width:90%;
max-width:700px;
margin:60px auto;
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 20px 45px rgba(0,0,0,.1);
}

.container h1{
text-align:center;
margin-bottom:10px;
color:#2563eb;
}

.container p{
text-align:center;
color:#64748b;
margin-bottom:35px;
}


.form-group{
margin-bottom:20px;
}

label{
display:block;
font-weight:600;
margin-bottom:8px;
}

input,select,textarea{

width:100%;
padding:14px;
border:1px solid #dbeafe;
border-radius:12px;
outline:none;
font-size:15px;

}

input:focus,
select:focus,
textarea:focus{

border-color:#2563eb;

}


textarea{
height:120px;
resize:none;
}


button{

width:100%;
padding:16px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#2563eb,#06b6d4);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;

}


button:hover{

transform:translateY(-3px);

}


.back{

display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#2563eb;

}

</style>

</head>


<body>


<header>

<div class="logo">
💰 Budget<span>Tracker</span>
</div>

<nav>

<a href="index.html">Home</a>

<a href="input-form.html">Add Expense</a>

<a href="record-list.html">Records</a>

<a href="dashboard.html">Dashboard</a>

<a href="admin-view.html">Admin</a>

<a href="input-form.html">
<button class="demo-btn">
Try Demo
</button>
</a>

</nav>

</header>



<div class="container">


<h1>Add New Expense</h1>

<p>
Record your daily spending and manage your budget easily.
</p>



<form id="expenseForm">


<div class="form-group">

<label>Amount</label>

<input type="number" id="amount" placeholder="Enter amount" required>

</div>



<div class="form-group">

<label>Category</label>

<select id="category" required>

<option value="">Select Category</option>

<option>Food</option>

<option>Transportation</option>

<option>Education</option>

<option>Shopping</option>

<option>Entertainment</option>

<option>Utilities</option>

<option>Other</option>

</select>

</div>



<div class="form-group">

<label>Date</label>

<input type="date" id="date" required>

</div>



<div class="form-group">

<label>Payment Method</label>

<select id="payment">

<option>Cash</option>

<option>Bank Transfer</option>

<option>E-wallet</option>

<option>Card</option>

</select>

</div>



<div class="form-group">

<label>Description</label>

<textarea id="description" placeholder="Enter expense details"></textarea>

</div>



<button type="submit">

Add Expense

</button>


</form>


<a href="index.html" class="back">

← Back to Home

</a>


</div>



<script>

document.getElementById("expenseForm").addEventListener("submit",function(e){

e.preventDefault();


let expense={

amount:document.getElementById("amount").value,

category:document.getElementById("category").value,

date:document.getElementById("date").value,

payment:document.getElementById("payment").value,

description:document.getElementById("description").value

};


let expenses=JSON.parse(localStorage.getItem("expenses")) || [];


expenses.push(expense);


localStorage.setItem("expenses",JSON.stringify(expenses));


alert("Expense added successfully!");


window.location.href="record-list.html";


});

</script>


</body>

</html>
