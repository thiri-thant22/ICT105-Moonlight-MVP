<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Detail | Budget Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}


body{

background:#f4f8ff;
color:#1f2937;

}



/* HEADER */


header{

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 7%;

background:white;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

position:sticky;

top:0;

z-index:100;

}



.logo{

font-size:30px;

font-weight:800;

color:#2563eb;

}



.logo span{

color:#111827;

}



nav{

display:flex;

gap:25px;

align-items:center;

}



nav a{

text-decoration:none;

color:#374151;

font-weight:500;

transition:.3s;

}



nav a:hover{

color:#2563eb;

}




.demo-btn{

padding:12px 25px;

border:none;

border-radius:30px;

background:

linear-gradient(
135deg,
#2563eb,
#06b6d4
);

color:white;

font-weight:600;

cursor:pointer;

}




/* CONTAINER */


.container{

width:90%;

margin:50px auto;

}




.title{

text-align:center;

margin-bottom:35px;

}



.title h1{

font-size:42px;

color:#2563eb;

font-weight:800;

}



.title p{

color:#64748b;

}



/* ===== DETAIL CARD ===== */


.detail-card{

background:white;

padding:40px;

border-radius:25px;

box-shadow:

0 15px 35px rgba(0,0,0,.08);

max-width:800px;

margin:auto;

}



.detail-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

flex-wrap:wrap;

}



.detail-header h2{

font-size:32px;

color:#2563eb;

}

.status{

padding:8px 18px;

border-radius:30px;

color:white;

font-weight:600;

font-size:14px;

}



.completed{

background:#22c55e;

}



.pending{

background:#f59e0b;

}



.cancelled{

background:#ef4444;

}




.info-grid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}




.info-box{

background:#f8fbff;

padding:20px;

border-radius:18px;

}



.info-box h3{

font-size:14px;

color:#64748b;

margin-bottom:8px;

}



.info-box p{

font-size:18px;

font-weight:600;

color:#1f2937;

}



.description{

margin-top:25px;

background:#f8fbff;

padding:20px;

border-radius:18px;

}



.description h3{

color:#64748b;

font-size:14px;

margin-bottom:8px;

}



.description p{

font-size:16px;

}




.back-btn{

display:block;

width:max-content;

margin:35px auto 0;

padding:13px 28px;

background:

linear-gradient(
135deg,
#2563eb,
#06b6d4
);

color:white;

text-decoration:none;

border-radius:30px;

font-weight:600;

transition:.3s;

}



.back-btn:hover{

transform:translateY(-3px);

box-shadow:

0 10px 25px rgba(37,99,235,.3);

}




footer{

margin-top:60px;

padding:25px;

background:white;

text-align:center;

color:#64748b;

}


@media(max-width:900px){

nav{

display:none;

}


.title h1{

font-size:32px;

}

}


</style>

</head>


<body>


<header>


<div class="logo">
Budget<span>Tracker</span>
</div>


<nav>

<a href="index.html">
Home
</a>

<a href="dashboard.html">
Dashboard
</a>

<a href="record-list.html">
Records
</a>

<a href="input.html">
Add Expense
</a>

<button class="demo-btn">
Try Demo
</button>

</nav>


</header>

<div class="container">


<div class="title">

<h1>
Expense Details
</h1>

<p>
View complete information about this transaction.
</p>

</div>




<div class="detail-card">


<div class="detail-header">


<h2 id="expenseTitle">
Expense
</h2>


<span 
id="expenseStatus"
class="status">
Status
</span>


</div>



<div class="info-grid">


<div class="info-box">

<h3>
Category
</h3>

<p id="expenseCategory">
-
</p>

</div>




<div class="info-box">

<h3>
Amount
</h3>

<p id="expenseAmount">
-
</p>

</div>




<div class="info-box">

<h3>
Date
</h3>

<p id="expenseDate">
-
</p>

</div>




<div class="info-box">

<h3>
Payment Method
</h3>

<p id="expensePayment">
-
</p>

</div>


</div>



<div class="description">


<h3>
Description
</h3>


<p id="expenseDescription">
-
</p>


</div>



<a href="record-list.html" class="back-btn">

← Back to Records

</a>



</div>


</div>



<footer>

© 2026 Budget Tracker | ICT105 Project

</footer>



<script>


let selectedId =
localStorage.getItem("selectedExpense");



let expenses =
JSON.parse(localStorage.getItem("expenses")) || [];



let expense = expenses.find(

item => item.id == selectedId

);




if(expense){



document.getElementById("expenseTitle").innerHTML =
expense.title;



document.getElementById("expenseCategory").innerHTML =
expense.category;



document.getElementById("expenseAmount").innerHTML =

"฿" + Number(expense.amount).toLocaleString();



document.getElementById("expenseDate").innerHTML =
expense.date;



document.getElementById("expensePayment").innerHTML =

expense.payment || "Cash";



document.getElementById("expenseDescription").innerHTML =

expense.description || "No description available";




let status =
document.getElementById("expenseStatus");



status.innerHTML =
expense.status;



if(expense.status==="Completed"){


status.classList.add("completed");


}


else if(expense.status==="Cancelled"){


status.classList.add("cancelled");


}


else{


status.classList.add("pending");


}



}

else{


document.querySelector(".detail-card").innerHTML = `

<h2 style="text-align:center;color:#2563eb">

No Expense Found

</h2>

<a href="record-list.html" 
class="back-btn">

Back to Records

</a>

`;

}



</script>



</body>

</html>
